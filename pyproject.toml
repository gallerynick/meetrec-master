[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "meetrec"
version = "0.1.0"
description = "MeetRec Master - 本地离线 ASR + 热词四阶段纠错 + 多 AI 纪要"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "gallerynick", email = "3523312096@qq.com" }]
keywords = ["asr", "speech-to-text", "meetings", "faster-whisper", "hotwords"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "cryptography>=46.0,<47",
    "keyring>=25.4,<27",
]

[project.optional-dependencies]
ui = [
    "PySide6==6.11.2",
    "sounddevice==0.5.6",
]
asr = [
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "onnxruntime==1.30.0",
]
ai = [
    "openai==2.36.0",
    "anthropic==1.6.0",
]
keywords = [
    "pypinyin==0.55.0",
    "rapidfuzz==3.14.6",
]
dev = [
    "pytest==9.0.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
meetrec = "meetrec.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meetrec"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tools/", "build/", "dist/", ".venv/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["meetrec"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["meetrec"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "accuracy: 准确率评测（需真实标注样本，默认不跑）",
    "ui: UI 交互测试（需 Qt 显示服务）",
    "slow: 耗时较长的集成测试",
]
